<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Country Study – Adabiyotlar röyxati</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d2433;--mut:#5b6475;--line:#dcdad2;--acc:#0b5d8a;--acc2:#e8f1f7;--warn:#9a5b00;--warnbg:#fff4de;--core:#1c7a4b;--corebg:#e6f4ec}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d222a;--ink:#e8eaee;--mut:#9aa3b2;--line:#2d343f;--acc:#6bb6e3;--acc2:#1b2a36;--warn:#f0b35a;--warnbg:#33281a;--core:#6fcf9a;--corebg:#16301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header{padding:28px 0 12px}
h1{font-size:1.55rem;margin:0 0 4px;line-height:1.25}
.sub{color:var(--mut);margin:0;font-size:.95rem}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab,.chip,button.mini{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
.tab[aria-pressed=true],.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.tab[aria-pressed=true],.chip[aria-pressed=true]{color:#0b1218}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
input[type=search]{flex:1 1 240px}
select{flex:1 1 220px;max-width:100%}
.stat{color:var(--mut);font-size:.88rem;margin:8px 0 0}
ol,ul{list-style:none;margin:14px 0;padding:0}
li.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;overflow-wrap:anywhere}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.no{font:600 .82rem ui-monospace,Consolas,monospace;color:var(--mut)}
.badge{font-size:.75rem;border-radius:5px;padding:1px 7px;border:1px solid var(--line);color:var(--mut)}
.badge.core{background:var(--corebg);color:var(--core);border-color:var(--core)}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.txt{margin:0}
.txt a{color:var(--acc)}
.tp{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tp span{font-size:.78rem;background:var(--acc2);color:var(--acc);border-radius:5px;padding:1px 7px;cursor:pointer}
.act{margin-left:auto}
button.mini{padding:2px 10px;font-size:.78rem;border-radius:6px}
h2{font-size:1.1rem;margin:22px 0 4px;padding-top:6px;border-top:1px solid var(--line)}
.note{background:var(--acc2);border-radius:10px;padding:10px 13px;font-size:.93rem;margin:12px 0}
.empty{color:var(--mut);padding:24px 0;text-align:center}
.tn{font:600 .85rem ui-monospace,Consolas,monospace;color:var(--acc);min-width:2.6em}
.tli{display:flex;gap:8px}
@media (max-width:700px){.bar{position:static}}
@media print{.bar,button,.act{display:none!important}body{background:#fff;color:#000}li.it{border:0;border-bottom:1px solid #ccc;border-radius:0}}
</style>
</head>

<div class="wrap">
<header>
<h1>Country Study (Mamlakatşunoslik): adabiyotlar va manbalar</h1>
<p class="sub">Darslikdagi barça mavzular (1–30) va E ilovasi böyiça yagona röyxat. Darslik matnidagi <b>[n]</b> havolalar “Mavzular böyiça” bölimidagi tegişli mavzu raqamiga mos keladi.</p>
</header>
<div class="bar">
<div class="tabs" role="group" aria-label="Köriniş">
<button class="tab" data-v="core" aria-pressed="true">Asosiy röyxat</button>
<button class="tab" data-v="topic" aria-pressed="false">Mavzular böyiça</button>
<button class="tab" data-v="all" aria-pressed="false">Töliq röyxat</button>
</div>
<div class="row">
<input type="search" id="q" placeholder="Qidiriş: muallif, sarlavha, URL, ISBN, DOI…" aria-label="Qidiriş">
<select id="tsel" aria-label="Mavzu"></select>
</div>
<div class="row" style="margin-top:8px" id="chips">
<button class="chip" data-t="I" aria-pressed="false">I. Meʼyoriy hujjatlar</button>
<button class="chip" data-t="II" aria-pressed="false">II. Kitob va maqolalar</button>
<button class="chip" data-t="III" aria-pressed="false">III. Internet manbalari</button>
<button class="chip" id="cflag" aria-pressed="false">Tekşirilişi kerak</button>
</div>
<p class="stat" id="stat"></p>
</div>
<div id="note"></div>
<div id="out" aria-live="polite"></div>
</div>

const items=DATA.items,TOP=DATA.topics;
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
items.forEach(i=>i._n=norm(i.x));
let view='core',types=new Set(), flagOnly=false;
const tsel=$('#tsel');
tsel.innerHTML='<option value="">Barcha mavzular</option>'+Object.keys(TOP).sort((a,b)=>(a==='G')-(b==='G')||(+a-+b)).map(k=>`<option value="${k}">${k==='G'?TOP[k]:k+'. '+TOP[k]}</option>`).join('');
const tname=k=>k==='G'?'G':'T'+k;
function linkify(el,text){
  const re=/(https?:\/\/[^\s)\]]+[^\s).,;\]])/g;let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)el.append(text.slice(last,m.index));
    const a=document.createElement('a');a.href=m[1];a.textContent=m[1];a.target='_blank';a.rel='noopener noreferrer';el.append(a);last=m.index+m[1].length;
  }
  if(last<text.length)el.append(text.slice(last));
}
function card(i,lead,topicCtx){
  const li=document.createElement('li');li.className='it';
  const top=document.createElement('div');top.className='top';
  const no=document.createElement('span');no.className='no';no.textContent=i.id;top.append(no);
  const ty=document.createElement('span');ty.className='badge';ty.textContent={I:'Meʼyoriy',II:'Kitob/maqola',III:'Internet'}[i.t];top.append(ty);
  if(i.core){const b=document.createElement('span');b.className='badge core';b.textContent='★ Asosiy roʻyxatda';top.append(b)}
  if(i.fl){const b=document.createElement('span');b.className='badge warn';b.textContent='Tekshirilsin';top.append(b)}
  if(i.nl){const b=document.createElement('span');b.className='badge warn';b.textContent='URL/DOI/ISBN yoʻq';top.append(b)}
  const bt=document.createElement('button');bt.className='mini act';bt.textContent='Nusxa olish';
  bt.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(i.x).then(()=>{bt.textContent='Nusxalandi';setTimeout(()=>bt.textContent='Nusxa olish',1200)}).catch(()=>{})};
  top.append(bt);li.append(top);
  const p=document.createElement('p');p.className='txt';linkify(p,i.x);li.append(p);
  if(i.r.length){
    const tp=document.createElement('div');tp.className='tp';
    i.r.forEach(([t,n])=>{const s=document.createElement('span');s.textContent=(t==='G'?'G':'T'+t+' ')+(t==='G'?n:'['+n+']');s.title=TOP[t]||'';s.onclick=()=>{tsel.value=t;setView('topic')};tp.append(s)});
    li.append(tp);
  }
  return li;
}
function match(i){
  if(types.size&&!types.has(i.t))return false;
  if(flagOnly&&!(i.fl||i.nl||i.c===0))return false;
  const t=tsel.value;if(t&&!i.r.some(r=>r[0]===t))return false;
  const q=norm($('#q').value.trim());
  if(q&&!q.split(/\s+/).every(w=>i._n.includes(w)))return false;
  return true;
}
function render(){
  const out=$('#out');out.textContent='';const note=$('#note');note.textContent='';
  let list;
  if(view==='core'){
    list=items.filter(i=>i.core&&match(i));
    const d=document.createElement('div');d.className='note';d.textContent='Bu — darslik oxiridagi bir sahifalik “Foydalanilgan adabiyotlar” roʻyxatiga kiritilgan eng muhim manbalar. Qolgan barcha manbalar “Toʻliq roʻyxat” va “Mavzular boʻyicha” boʻlimlarida.';note.append(d);
  }else if(view==='all')list=items.filter(match);
  else list=null;
  if(list){
    $('#stat').textContent=list.length+' ta yozuv ('+items.length+' tadan)';
    if(!list.length){out.innerHTML='<p class="empty">Hech narsa topilmadi.</p>';return}
    const ol=document.createElement('ol');
    if(view==='all'){let cur='';list.forEach(i=>{if(i.t!==cur){cur=i.t;const h=document.createElement('h2');h.textContent={I:'I. Meʼyoriy hujjatlar va rasmiy matnlar / Normative and official documents',II:'II. Darsliklar, monografiyalar va maqolalar / Textbooks, monographs and articles',III:'III. Internet manbalari / Internet sources'}[cur];out.append(h)}
      ol.append(card(i))})}
    else list.forEach(i=>ol.append(card(i)));
    out.append(ol);return;
  }
  // topic view
  const keys=Object.keys(TOP).sort((a,b)=>(a==='G')-(b==='G')||(+a-+b)).filter(k=>!tsel.value||tsel.value===k);
  let total=0;
  keys.forEach(k=>{
    const rows=[];items.forEach(i=>{if(!match(i))return;i.r.forEach(([t,n])=>{if(t===k)rows.push([+n||n,n,i])})});
    if(!rows.length)return;rows.sort((a,b)=>(typeof a[0]==='number'&&typeof b[0]==='number')?a[0]-b[0]:String(a[1]).localeCompare(String(b[1])));
    total+=rows.length;
    const h=document.createElement('h2');h.textContent=(k==='G'?TOP[k]:k+'-mavzu. '+TOP[k]);out.append(h);
    const ol=document.createElement('ol');
    rows.forEach(([_,n,i])=>{const li=card(i);const w=document.createElement('div');w.className='tli';const tn=document.createElement('span');tn.className='tn';tn.textContent=(k==='G'?String(n):'['+n+']');w.append(tn);li.style.flex='1';const wrap=document.createElement('li');wrap.style.listStyle='none';wrap.append(w);w.append(li);ol.append(wrap)});
    out.append(ol);
  });
  $('#stat').textContent=total+' ta havola (mavzu roʻyxatlari boʻyicha; bir manba bir necha mavzuda uchrashi mumkin)';
  if(!total)out.innerHTML='<p class="empty">Hech narsa topilmadi.</p>';
}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.querySelectorAll('#chips .chip[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;types.has(t)?types.delete(t):types.add(t);b.setAttribute('aria-pressed',types.has(t));render()});
$('#cflag').onclick=e=>{flagOnly=!flagOnly;e.target.setAttribute('aria-pressed',flagOnly);render()};
$('#q').addEventListener('input',render);tsel.addEventListener('change',render);
(function(){try{const m=/[#&]t=(G|\d+)/.exec(location.hash);if(m&&TOP[m[1]]){tsel.value=m[1];view='topic';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==='topic'))}}catch(e){}})();
render();
</script>
